<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebTalk TTS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>WebTalk TTS</h1>
      <p class="subtitle">Text-to-Speech Settings</p>
    </header>

    <main class="settings">
      <!-- Voice Selection -->
      <div class="control-group">
        <label for="voice-select">Voice</label>
        <select id="voice-select" class="voice-select">
          <option value="">Loading voices...</option>
        </select>
      </div>

      <!-- Rate Slider -->
      <div class="control-group">
        <div class="slider-header">
          <label for="rate-slider">Speed</label>
          <span id="rate-value" class="slider-value">1.0x</span>
        </div>
        <input
          type="range"
          id="rate-slider"
          class="slider"
          min="0.5"
          max="2.0"
          step="0.1"
          value="1.0"
        >
        <div class="slider-labels">
          <span>0.5x</span>
          <span>2.0x</span>
        </div>
      </div>

      <!-- Pitch Slider -->
      <div class="control-group">
        <div class="slider-header">
          <label for="pitch-slider">Pitch</label>
          <span id="pitch-value" class="slider-value">1.0</span>
        </div>
        <input
          type="range"
          id="pitch-slider"
          class="slider"
          min="0.5"
          max="2.0"
          step="0.1"
          value="1.0"
        >
        <div class="slider-labels">
          <span>Low</span>
          <span>High</span>
        </div>
      </div>

      <!-- Test Button -->
      <div class="control-group">
        <button id="test-voice-btn" class="btn btn-primary">
          Test Voice
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>Select text on any page, right-click, and choose "Speak highlighted text"</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
